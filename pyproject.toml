[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pysurf-browser"
version = "2.1.0"
description = "Python-only Qt 6 and Chromium desktop browser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8",
    "PySide6-WebEngine>=6.8",
]

[project.scripts]
pysurf = "pysurf.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pysurf*"]

[tool.setuptools.package-data]
pysurf = ["home.html"]
