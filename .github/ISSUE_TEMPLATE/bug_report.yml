name: Bug report
description: Report a reproducible problem in Nebula.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Before submitting, search open issues for a similar report.
  - type: input
    id: version
    attributes:
      label: Nebula version
      placeholder: "For example, 2.1.0"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal sequence of actions.
      placeholder: "1. Open Nebula\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove credentials and personal browsing information before sharing.
    validations:
      required: false
